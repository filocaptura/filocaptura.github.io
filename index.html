<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyD6QGZ8-0kTadVXxEPavR0fUm_8XD1vqEQ",
  authDomain: "deusivenatura-b042b.firebaseapp.com",
  projectId: "deusivenatura-b042b",
  storageBucket: "deusivenatura-b042b.firebasestorage.app",
  messagingSenderId: "854823557109",
  appId: "1:854823557109:web:68b241193ead69a55572bc",
});
const db = getFirestore(app);
const TP = "terrapesos-data-v1", MOV = "terrapesos-movimientos";
const addT = (p, n) => ((parseInt(String(p).replace(/[.\s]/g, ""), 10) || 0) + n).toLocaleString("es-CL");
const api = {
  async roster() {
    const s = await getDoc(doc(db, "shared", TP)); if (!s.exists()) return null;
    const d = JSON.parse(s.data().value);
    return (d.estudiantesPorCurso || []).filter((c) => c.id === "3medio" || c.id === "4medio")
      .map((c) => ({ id: c.id, nombre: c.nombre, estudiantes: (c.estudiantes || []).map((e) => e.label) }));
  },
  async loadProfile(key) { const s = await getDoc(doc(db, "shared", "filo_" + key)); return s.exists() ? JSON.parse(s.data().value) : null; },
  async saveProfile(key, obj) { await setDoc(doc(db, "shared", "filo_" + key), { value: JSON.stringify(obj) }); },
  async getConfig() { const s = await getDoc(doc(db, "shared", "filo_config")); return s.exists() ? JSON.parse(s.data().value) : null; },
  async setConfig(obj) { await setDoc(doc(db, "shared", "filo_config"), { value: JSON.stringify(obj) }); },
  async pay(cursoId, nombre, amount, motivo) {
    const ref = doc(db, "shared", TP), mref = doc(db, "shared", MOV);
    await runTransaction(db, async (tx) => {
      const s = await tx.get(ref); if (!s.exists()) throw new Error("sin-datos");
      const m = await tx.get(mref);
      const d = JSON.parse(s.data().value); let found = false;
      d.estudiantesPorCurso = d.estudiantesPorCurso.map((c) => c.id !== cursoId ? c : { ...c, estudiantes: c.estudiantes.map((e) => { if (e.label !== nombre) return e; found = true; return { ...e, price: addT(e.price, amount) }; }) });
      if (!found) throw new Error("no-estudiante");
      let lista = []; if (m.exists()) { try { lista = JSON.parse(m.data().value); } catch (e) {} }
      const curso = d.estudiantesPorCurso.find((c) => c.id === cursoId);
      lista = [{ t: new Date().toISOString(), curso: curso.nombre, nombre, delta: amount, motivo }, ...lista].slice(0, 150);
      tx.set(ref, { value: JSON.stringify(d) }); tx.set(mref, { value: JSON.stringify(lista) });
    });
  },
};
if (window._filoReady) window._filoReady(api);
</script>

let actx = null;
function beep(seq, type = "square", vol = 0.06) {
  if (!SOUND_ON) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = actx || new AC(); if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime;
    seq.forEach(([f, s, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + s); g.gain.exponentialRampToValueAtTime(vol, t0 + s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
      o.connect(g); g.connect(actx.destination); o.start(t0 + s); o.stop(t0 + s + d + 0.05);
    });
  } catch (e) {}
}

/* ---------- entrada (teclado + táctil) ---------- */
const input = { held: { up: false, down: false, left: false, right: false }, a: false, b: false, start: false };
let waiters = [];
const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", KeyZ: "a", Space: "a", KeyJ: "a", KeyX: "b", Escape: "b", Backspace: "b", KeyK: "b", Enter: "start", KeyC: "start" };
function press(btn) {
  if (waiters.length) {
    const w = waiters.find((w) => w.btns.includes(btn) || (btn === "start" && w.btns.includes("a")));
    if (w) { waiters.splice(waiters.indexOf(w), 1); w.r(btn === "start" && !w.btns.includes("start") ? "a" : btn); return; }
  }
  if (btn === "a") input.a = true; if (btn === "b") input.b = true; if (btn === "start") input.start = true;
}
const waitPress = (btns) => new Promise((r) => waiters.push({ btns, r }));
window.addEventListener("keydown", (e) => {
  const b = KEYMAP[e.code]; if (!b) return;
  e.preventDefault();
  if (["up", "down", "left", "right"].includes(b)) { input.held[b] = true; press(b); }
  else if (!e.repeat) press(b);
});
window.addEventListener("keyup", (e) => { const b = KEYMAP[e.code]; if (b && input.held[b] !== undefined) input.held[b] = false; });
window.addEventListener("blur", () => { for (const k in input.held) input.held[k] = false; });
document.querySelectorAll("[data-btn]").forEach((el) => {
  const b = el.dataset.btn;
  const down = (e) => { e.preventDefault(); el.classList.add("on"); if (input.held[b] !== undefined) { input.held[b] = true; press(b); } else press(b); };
  const up = (e) => { e.preventDefault(); el.classList.remove("on"); if (input.held[b] !== undefined) input.held[b] = false; };
  el.addEventListener("pointerdown", down); el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up);
});


/* anti-zoom en móviles (iOS ignora user-scalable=no) */
(() => {
  const stop = (e) => e.preventDefault();
  ["gesturestart", "gesturechange", "gestureend", "dblclick", "contextmenu"].forEach((ev) => document.addEventListener(ev, stop, { passive: false }));
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
  let lastEnd = 0;
  document.addEventListener("touchend", (e) => { const n = Date.now(); if (n - lastEnd < 400) e.preventDefault(); lastEnd = n; }, { passive: false });
  document.addEventListener("touchstart", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();

/* ----- personajes del mundo (16x16) ----- */
function makeChar(o) {
  const out = [[], [], [], []]; // down, up, left, right
  for (let d = 0; d < 4; d++) for (let f = 0; f < 3; f++) {
    const [c, x] = mk(16, 16);
    const px = (X, Y, col, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
    px(4, 14, "rgba(0,0,0,0.25)", 8, 1); px(5, 15, "rgba(0,0,0,0.18)", 6, 1);
    const lift = (f === 1 ? 1 : 0), lift2 = (f === 2 ? 1 : 0);
    // piernas
    if (d < 2) { px(5, 11 - lift, o.pants, 2, 3 + lift - 0); px(9, 11 - lift2, o.pants, 2, 3 + lift2 - 0); px(5, 13 - lift, o.shoe || "#4a3020", 2, 1); px(9, 13 - lift2, o.shoe || "#4a3020", 2, 1); }
    else { const s = f === 0 ? 0 : (f === 1 ? -1 : 1); px(6 + s, 11, o.pants, 2, 3); px(8 - s, 11, o.pants, 2, 3); px(6 + s, 13, o.shoe || "#4a3020", 2, 1); px(8 - s, 13, o.shoe || "#4a3020", 2, 1); }
    // túnica
    px(4, 6, o.tunic, 8, 6); px(4, 6, o.tunicLight || o.tunic, 8, 1); px(4, 10, o.accent, 8, 1);
    px(4, 11, o.tunicDark || o.tunic, 8, 1);
    // brazos
    if (d < 2) { px(3, 7, o.tunic, 1, 4); px(12, 7, o.tunic, 1, 4); px(3, 11, o.skin, 1, 1); px(12, 11, o.skin, 1, 1); }
    else { px(d === 2 ? 5 : 9, 7, o.tunicDark || o.tunic, 2, 4); px(d === 2 ? 5 : 10, 11, o.skin, 1, 1); }
    // mochila al ir de espaldas / de lado
    if (o.pack && d === 1) px(5, 6, o.pack, 6, 5);
    if (o.pack && d >= 2) px(d === 2 ? 10 : 4, 7, o.pack, 2, 4);
    // cabeza
    px(5, 1, o.skin, 6, 6); px(4, 2, o.skin, 8, 4);
    if (d === 0) { px(4, 0, o.hair, 8, 3); px(4, 3, o.hair, 1, 2); px(11, 3, o.hair, 1, 2); px(6, 4, "#1b1d2e"); px(9, 4, "#1b1d2e"); if (o.beard) px(6, 6, o.beard, 4, 2); }
    if (d === 1) { px(4, 0, o.hair, 8, 6); px(5, 6, o.hair, 6, 1); }
    if (d === 2) { px(4, 0, o.hair, 8, 3); px(8, 3, o.hair, 4, 3); px(5, 4, "#1b1d2e"); if (o.beard) px(4, 6, o.beard, 3, 2); }
    if (d === 3) { px(4, 0, o.hair, 8, 3); px(4, 3, o.hair, 4, 3); px(10, 4, "#1b1d2e"); if (o.beard) px(9, 6, o.beard, 3, 2); }
    if (o.hat) { px(3, 0, o.hat, 10, 1); px(4, -1, o.hat, 8, 1); }
    out[d][f] = c;
  }
  return out;
}

/* ----- retratos de filósofos (batalla): 32x32 escalado x2 ----- */

function newMap(w, h, fill = ".") { return { w, h, t: Array.from({ length: h }, () => Array(w).fill(fill)), warps: {}, npcs: [], signs: {}, grass: false, name: "" }; }
function rect(m, x, y, w, h, ch) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < m.w && j < m.h) m.t[j][i] = ch; }
function put(m, x, y, ch) { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.t[y][x] = ch; }
function building(m, x, y, w, doorX) {
  rect(m, x, y, w, 2, "R"); rect(m, x, y + 2, w, 1, "H"); rect(m, x, y + 3, w, 1, "H");
  for (let i = 1; i < w - 1; i += 2) if (x + i !== doorX) put(m, x + i, y + 2, "W");
  if (doorX != null) put(m, doorX, y + 3, "D");
}
function scatter(m, ch, n, onlyOn, seed) {
  let s = seed;
  for (let i = 0; i < n; i++) {
    s = (s * 9301 + 49297) % 233280; const x = Math.floor((s / 233280) * m.w);
    s = (s * 9301 + 49297) % 233280; const y = Math.floor((s / 233280) * m.h);
    if (m.t[y] && m.t[y][x] === onlyOn) m.t[y][x] = ch;
  }
}

function specMap(c, sp) {
  const m = newMap(30, 20, "."); m.name = c.name; m.music = c.music; m.bg = c.id + "_e"; m.spec = sp;
  const R = (x, y, w, h, ch) => rect(m, x, y, w, h, ch);
  R(0, 0, 30, 2, "X"); R(0, 0, 2, 20, "X"); R(28, 0, 2, 20, "X"); R(0, 18, 30, 2, "X");
  sp.solids.forEach(([x, y, w, h]) => R(x, y, w, h, "X"));
  R(14, 18, 2, 2, "."); // camino de salida
  (sp.carve || []).forEach(([x, y, w, h]) => R(x, y, w, h, "."));
  sp.doors.forEach(([x, y]) => { m.t[y][x] = "."; m.warps[x + "," + y] = { to: c.id + "_sala", x: (c.iarr || [7, 8])[0], y: (c.iarr || [7, 8])[1], dir: "up" }; });
  [14, 15].forEach((x) => { m.warps[x + ",19"] = { road: c.k }; });
  m.wildTiles = new Set(); (sp.wild || []).forEach(([x, y, w, h]) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (m.t[j][i] === ".") m.wildTiles.add(i + "," + j); });
  if (c.wild) { m.wild = c.wild; m.lv = c.lv; }
  (sp.trainers || []).forEach((t) => m.npcs.push({ ...t, spec: t.spec || c.tspec || NPC_SPEC("#4a3a2a", "#8a7a5a", "#6a5a3a", "#fff", "#4a3a2a") }));
  return m;
}

async function say(text, o = {}) {
  const lines = wrapPx(text, 212); const pages = [];
  for (let i = 0; i < lines.length; i += 2) pages.push(lines.slice(i, i + 2));
  for (let pi = 0; pi < pages.length; pi++) {
    const t = ui.text = { lines: pages[pi], n: 0, total: pages[pi].join("").length, last: pi === pages.length - 1 };
    while (t.n < t.total) { const r = await waitOrTime(["a", "b"], 2); if (r !== "time") t.n = t.total; }
    if (o.auto) await frames(o.auto); else await waitPress(["a", "b"]);
    SFX.tick();
  }
  ui.text = null;
}
function waitOrTime(btns, n) {
  return new Promise((res) => {
    const w = { btns, r: (b) => res(b) };
    const tw2 = { t: tick + n, r: () => { waiters = waiters.filter((x) => x !== w); res("time"); } };
    waiters.push(w); tickWaiters.push(tw2);

}

async function menu(opts, o = {}) {

  const m = ui.menu = { opts, x: o.x ?? 150, y: o.y ?? 4, w: o.w ?? 86, h: o.h ?? rows * lh + 10, cols, lh, cur: o.start || 0 };
  if (o.onMove) o.onMove(m.cur);
  let res;
  for (;;) {
    const b = await waitPress(["up", "down", "left", "right", "a", "b"]);
    if (b === "a") { SFX.select(); res = m.cur; break; }
    if (b === "b" && o.cancel !== false) { res = -1; break; }
    let c = m.cur;
    if (cols === 1) { if (b === "up") c = (c + opts.length - 1) % opts.length; if (b === "down") c = (c + 1) % opts.length; }
    else {
      if (b === "left" && c % cols > 0) c--; if (b === "right" && c % cols < cols - 1 && c + 1 < opts.length) c++;
      if (b === "up" && c - cols >= 0) c -= cols; if (b === "down" && c + cols < opts.length) c += cols;
    }
    if (c !== m.cur) { m.cur = c; SFX.move(); if (o.onMove) o.onMove(c); }

}

    const r = Math.random(); let pool;

    else if (r < 0.8) pool = BANK[h];

const GROUND = { ".": "grass", ",": "grass", F: "grass", T: "grass", S: "grass", f: "grass", _: "dirt", "~": "water", v: "cave", V: "cave" };
let WATERPAT = null;
function drawGround(g, x, y, dx, dy) {

    if (!WATERPAT) WATERPAT = ctx.createPattern(TEX.water, "repeat");
    const ox = ((x * TS + tick * 0.12) % 64), oy = (y * TS + Math.sin(tick / 50 + x) * 1.5 + 64) % 64;

function loadTextures() {

function drawWorld() {
  const m = curMap(); const mw = m.w * TS, mh = m.h * TS;
  const px = P.x * TS + P.ox, py = P.y * TS + P.oy;
  let cx = Math.round(px + 8 - W / 2), cy = Math.round(py + 8 - H / 2);
  cx = mw <= W ? -Math.floor((W - mw) / 2) : clamp(cx, 0, mw - W);
  cy = mh <= H ? -Math.floor((H - mh) / 2) : clamp(cy, 0, mh - H);
  ctx.fillStyle = "#101018"; ctx.fillRect(0, 0, W, H);
  const x0 = Math.max(0, Math.floor(cx / TS)), x1 = Math.min(m.w - 1, Math.floor((cx + W) / TS));

let bt = null;
function initBattle(cfg) {

  foes.forEach((f) => { f.shown = f.hp; });
  if (cfg.handicap) { const f = foes[foes.length - 1]; f.hp = Math.max(1, Math.floor(mhp(f) * (1 - 0.12 * cfg.handicap))); f.shown = f.hp; }

function resetFx() { bt.fx = { foeDx: 0, foeDy: 0, meDx: 0, meDy: 0, foeVis: true, meVis: true, foeClip: 1, meClip: 1, burst: null, orb: null }; }
const fname = (m) => DEX[m.id].name + (bt.cfg.kind === "wild" ? " salvaje" : " rival");
const mname = (m) => DEX[m.id].name;
async function tweenHp(m) {
  while (Math.abs(m.shown - m.hp) > 0.01) {
    const step = Math.max(0.35, mhp(m) / 70);
    if (m.shown > m.hp) m.shown = Math.max(m.hp, m.shown - step); else m.shown = Math.min(m.hp, m.shown + step);
    await frames(1);
  }
  m.shown = m.hp;
}
async function slideIn(side) {
  const k = side === "foe" ? "foeDx" : "meDx"; const from = bt.fx[k];
  SFX.select();
  for (let i = 1; i <= 20; i++) { bt.fx[k] = Math.round(from * (1 - i / 20)); await frames(1); }
  bt.fx[k] = 0;
}
async function lunge(side) {
  const k = side === "me" ? ["meDx", "meDy"] : ["foeDx", "foeDy"]; const s = side === "me" ? 1 : -1;
  for (let i = 0; i < 6; i++) { bt.fx[k[0]] = s * i * 2; bt.fx[k[1]] = -s * i; await frames(1); }
  for (let i = 6; i >= 0; i--) { bt.fx[k[0]] = s * i * 2; bt.fx[k[1]] = -s * i; await frames(1); }
  bt.fx[k[0]] = 0; bt.fx[k[1]] = 0;

async function hitFx(side, col, mult) {
  const tx = side === "foe" ? 184 : 54, ty = side === "foe" ? 38 : 82;
  const v = side === "foe" ? "foeVis" : "meVis";

function calcDmg(att, def, mv, mult, crit) {
  const a = stats(att), d = stats(def);
  let dmg = Math.floor(((2 * att.lv / 5 + 2) * mv[2] * a.atk / d.def) / 50) + 2;
  if (DEX[att.id].type === mv[1]) dmg *= 1.25;

  return Math.max(1, Math.floor(dmg));
}
async function useMove(side, mv, scale) {
  const att = side === "me" ? bt.me : bt.foe, def = side === "me" ? bt.foe : bt.me;

  const mult = typeMult(mv[1], DEX[def.id].type); const crit = Math.random() < 1 / 16;
  await hitFx(side === "me" ? "foe" : "me", TYPES[mv[1]].col, mult);
  const dmg = Math.max(1, Math.floor(calcDmg(att, def, mv, mult, crit) * scale));
  def.hp = Math.max(0, def.hp - dmg); await tweenHp(def);

    await frames(1);
    if (input.start) { input.start = false; await pauseMenu(); continue; }
    if (input.a) { input.a = false; await interact(); clearInput(); continue; }
    let d = null;
    for (const k of ["up", "down", "left", "right"]) if (input.held[k]) { d = k; if (k === P.dir) break; }
    if (!d) { P.walking = false; continue; }
    if (d !== P.dir && !P.walking) { P.dir = d; await frames(5); if (!input.held[d]) continue; }
    const moved = await walk(d, false);
    if (!moved) continue;
    const m = curMap(), key = P.x + "," + P.y;
    if (m.warps[key]) { await warpTo(m.warps[key]); clearInput(); continue; }
    const tr = checkSight(); if (tr) { P.walking = false; await trainerSpot(tr); clearInput(); continue; }
    if (alive().length && (((m.grass && m.t[P.y][P.x] === ",") || (m.cave && m.t[P.y][P.x] === "v")) && Math.random() < 0.14 || (m.wildTiles && m.wildTiles.has(key) && Math.random() < 0.3))) { P.walking = false; await wildEncounter(); clearInput(); }
  }
}

async function startGame(fresh) {
  mode = "world"; ui.fade = 1;
  if (fresh) newGame();
  adminBoost();
  banner(curMap().name);
  flushPending();
  if (fresh) await introScene(); else await fadeTo(0, 20);
  await worldLoop();
}

async function titleScreen() {
  mode = "title"; ui.fade = 0; ui.screen = null; S = null; ID = null;
  for (;;) {
    await waitPress(["a", "start"]);
    SFX.select();
    if (!(await identify())) { ID = null; continue; }
    await loadProfile();
    for (;;) {
      const opts = []; if (hasSave()) opts.push("CONTINUAR"); opts.push("NUEVO JUEGO", "MIS LOGROS"); if (ID.admin) opts.push("CLAVES DE PUERTAS", "REINICIAR ALUMNO"); opts.push("CAMBIAR JUGADOR");
      const r = await menu(opts, { x: 60, y: opts.length > 4 ? 64 : 84, w: 120, cancel: false });
      const choice = opts[r];
      if (choice === "CONTINUAR") { if (loadGame()) { await fadeTo(1, 12); await startGame(false); return; } }
      else if (choice === "NUEVO JUEGO") {
        if (hasSave()) { const c = await menu(["NO", "SÍ, BORRAR"], { x: 60, y: 84, w: 120, cancel: true }); if (c !== 1) continue; }
        SAVED = null; try { localStorage.removeItem(lsKey("save")); } catch (e) {}
        await fadeTo(1, 12); await startGame(true); return;
      } else if (choice === "MIS LOGROS") await logrosScreen();
      else if (choice === "REINICIAR ALUMNO") await resetStudent();
      else if (choice === "CLAVES DE PUERTAS") await adminKeys();
      else { try { localStorage.removeItem("filosofos-id"); } catch (e) {} ID = null; break; }
    }
  }
}

let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts; acc += Math.min(100, ts - last); last = ts;
  let n = 0;
  while (acc >= 1000 / 60 && n < 3) {
    acc -= 1000 / 60; tick++; n++;
    if (ui.text && ui.text.n < ui.text.total) ui.text.n = Math.min(ui.text.total, ui.text.n + 1);
    const due = tickWaiters.filter((w) => tick >= w.t);
    if (due.length) { tickWaiters = tickWaiters.filter((w) => tick < w.t); due.forEach((w) => w.r()); }
  }
  musicUpdate();
  drawAll();
  requestAnimationFrame(frame);
}
function wantTrack() {
  if (mode === "title" || !S) return "title";
  if (mode === "battle" && bt) { const c = bt.cfg; if (c.kind === "boss") return c.name === "Sócrates" ? "socrates" : c.name === "Platón" ? "platon" : "boss"; if (c.kind === "trainer") return "trainer"; return "battle"; }
  return MAPMUS[S.map] || "town";
}
function musicUpdate() {
  if (!SOUND_ON) { if (MUS.gain) stopMusic(); return; }
  if (MUS.lock) return;
  MUS.mul = (mode === "battle" && bt && bt.me && bt.me.hp > 0 && bt.me.hp / mhp(bt.me) < 0.25) ? 1.15 : 1;
  const w = wantTrack();
  if (MUS.name !== w) startMusic(w);
}
function boot() {
  makeTiles();
  window.__FILO = { ui, get S() { return S; }, P, get mode() { return mode; }, get bt() { return bt; }, input, press, get MAPS() { return MAPS; }, get DEX() { return DEX; }, get QUESTS() { return QUESTS; }, get ID() { return ID; }, runBattle, mhp, stats };
  requestAnimationFrame(frame);
  titleScreen();
}
const fontReady = (document.fonts && document.fonts.load)
  ? Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise((r) => setTimeout(r, 2500))]).catch(() => {})
  : Promise.resolve();
Promise.all([fontReady, loadTextures(), withTimeout(window.FILO_READY || Promise.resolve(null), 4500).then((a) => { DB = a; })]).then(boot);
})();
